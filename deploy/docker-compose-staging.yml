version: '3.8'
services:
  restaurante:
    image: "${IMAGE}"
    container_name: restaurante-staging
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=staging
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
