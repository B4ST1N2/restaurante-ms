name: CI/CD - Production (Docker → Render, manual)

on:
  workflow_dispatch:

env:
  IMAGE_NAME: restaurante

jobs:
  build-and-test:
    name: Build & Test (prod)
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: eclipse-temurin
          java-version: '17'
          cache: maven

      - name: Cache Maven local repo
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Run tests and jacoco (prod threshold 85%)
        run: mvn -B -Djacoco.line.covered.ratio=0.85 clean verify

      - name: Set image tag
        id: set_tag
        run: echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Upload jacoco report (prod)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-prod
          path: target/site/jacoco

  wait-for-approval:
    name: Wait for approval (GitHub Environment)
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - run: echo "Waiting approval for production deploy"

  build-and-push:
    name: Build, Push & Trigger Deploy (prod)
    needs: wait-for-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        env:
          IMAGE: ${{ secrets.DOCKER_REGISTRY_HOST }}/${{ secrets.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-test.outputs.image-tag }}
        run: |
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Trigger Render deploy (prod)
        if: success()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_PROD_SERVICE_ID: ${{ secrets.RENDER_PROD_SERVICE_ID }}
        run: |
          echo "Triggering render deploy for $IMAGE"
          curl -X POST "https://api.render.com/v1/services/${RENDER_PROD_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
