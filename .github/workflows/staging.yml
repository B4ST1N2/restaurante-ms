name: CI/CD - Staging (Docker)

on:
  push:
    branches: [ "trunk" ]

env:
  IMAGE_NAME: restaurante

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: eclipse-temurin
          java-version: '17'
          cache: maven

      - name: Cache Maven local repo
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Run tests and jacoco (mvn verify)
        run: mvn -B clean verify

      - name: Set image tag
        id: set_tag
        run: echo "::set-output name=image_tag::${{ github.sha }}"

  build-and-push:
    name: Build Docker image & Push
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        env:
          IMAGE: ${{ secrets.DOCKER_REGISTRY_HOST }}/${{ secrets.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-test.outputs.image-tag }}
        run: |
          echo "Building $IMAGE"
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to staging server (SSH)
        env:
          IMAGE: ${{ secrets.DOCKER_REGISTRY_HOST }}/${{ secrets.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-test.outputs.image-tag }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          echo "$STAGING_SSH_KEY" > key_staging.pem || true
          chmod 600 key_staging.pem || true
          # copy compose file
          scp -o StrictHostKeyChecking=no -i key_staging.pem deploy/docker-compose-staging.yml $STAGING_USER@$STAGING_HOST:/home/$STAGING_USER/docker-compose-staging.yml
          # create remote .env (recommended, do NOT store credentials in git)
          ssh -o StrictHostKeyChecking=no -i key_staging.pem $STAGING_USER@$STAGING_HOST "
            export IMAGE=$IMAGE
            # create or update .env with DB creds if provided via secrets (alternatively create manually on server)
            cat > /home/$STAGING_USER/.env <<EOF
  IMAGE=$IMAGE
  DB_URL=${{ secrets.STAGING_DB_URL }}
  DB_USER=${{ secrets.STAGING_DB_USER }}
  DB_PASS=${{ secrets.STAGING_DB_PASS }}
  EOF
  # pull image, then run compose
  docker pull \$IMAGE || true
  IMAGE=\$IMAGE docker-compose -f /home/$STAGING_USER/docker-compose-staging.yml up -d --remove-orphans
  "
