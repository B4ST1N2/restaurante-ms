name: CI/CD - Staging (Docker → Render)

on:
  push:
    branches: ["trunk"]

permissions:
  contents: read
  workflows: write

env:
  IMAGE_NAME: restaurante

jobs:
  build-and-test:
    name: Build & Test (staging)
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache Maven local repo
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Run tests and jacoco (staging threshold 60%)
        run: mvn -B -Djacoco.line.covered.ratio=0.60 clean verify

      - name: Set image tag
        id: set_tag
        run: echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Upload jacoco report (staging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-staging
          path: target/site/jacoco

  trigger-render-build:
    name: Trigger Render to build from repo (staging)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      - name: Trigger Render rebuild (Render will build using Dockerfile in repo)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
        run: |
          echo "Triggering render rebuild for staging (Render will build using Dockerfile in repo)"
          curl -s -X POST "https://api.render.com/v1/services/${RENDER_STAGING_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
          || (echo "Render API call failed"; exit 1)

  trigger-production-workflow:
    name: Trigger production workflow (only if staging passed)
    needs: trigger-render-build
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - name: Trigger production workflow_dispatch
        uses: peter-evans/workflow-dispatch@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow: "ci-production.yml"
          ref: trunk
