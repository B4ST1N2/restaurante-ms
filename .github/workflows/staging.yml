name: CI/CD - Staging (Docker → Render)

on:
  push:
    branches: ["trunk"]

env:
  IMAGE_NAME: restaurante

jobs:
  build-and-test:
    name: Build & Test (staging)
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache Maven local repo
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Run tests and jacoco (staging threshold 60%)
        run: mvn -B -Djacoco.line.covered.ratio=0.60 clean verify

      - name: Set image tag
        id: set_tag
        run: echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Upload jacoco report (staging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-staging
          path: target/site/jacoco

  build-and-push:
    name: Build, Push & Trigger Deploy (staging)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Debug IMAGE
        run: echo "Pushing IMAGE = $IMAGE"

      - name: Set Docker image tag
        id: set_tag
        run: echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push image
        run: |
          IMAGE="${DOCKER_REGISTRY_HOST}/${DOCKER_REPO}:${{ steps.set_tag.outputs.image_tag }}"
          docker build -t $IMAGE .
          echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin $DOCKER_REGISTRY_HOST
          docker push $IMAGE



      - name: Trigger Render deploy (staging)
        if: success()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
        run: |
          echo "Triggering render deploy for $IMAGE"
          curl -X POST "https://api.render.com/v1/services/${RENDER_STAGING_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
